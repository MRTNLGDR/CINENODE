services:
  cinenode:
    build: .
    ports: ["8765:8765"]
    environment:
      CINENODE_AUTH_TOKEN: ${CINENODE_AUTH_TOKEN:?set CINENODE_AUTH_TOKEN in .env}
      CINENODE_MODE: server
      CINENODE_HOST: 0.0.0.0
    volumes: ["cinenode-data:/data"]
    restart: unless-stopped
volumes:
  cinenode-data:
