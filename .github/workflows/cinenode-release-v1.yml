name: CineNode verified release v1

on:
  push:
    branches: [main]
    paths:
      - ".cinenode/bootstrap_patch_v2.py"
      - ".github/workflows/cinenode-release-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinenode-release-v1-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize source and apply recovery patch
        run: |
          python3 .cinenode/bootstrap_core_v1.py
          python3 .cinenode/bootstrap_product_v1.py
          python3 .cinenode/bootstrap_patch_v1.py
          python3 .cinenode/bootstrap_patch_v2.py
          test -f src/cinenode/jobs.py
          test -f tests/test_recovery.py
          test -f src/cinenode/capabilities.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          python -m pip install --disable-pip-version-check -U pip setuptools wheel
          python -m pip install -e '.[dev]'

      - name: Normalize and statically verify
        run: |
          python -m ruff check . --fix
          python -m ruff format .
          python -m ruff check .
          python -m ruff format --check .
          python -m compileall -q src tests scripts
          for file in src/cinenode/web/*.js; do node --check "$file"; done

      - name: Run full functional regression
        run: |
          python -m pytest -q --junitxml=junit.xml --cov=cinenode --cov-fail-under=0 --cov-report=json:coverage.json --cov-report=term-missing

      - name: Build and inspect wheel
        run: |
          rm -rf dist build
          python -m build --wheel
          python scripts/check_wheel.py dist/*.whl
          python -m cinenode verify --source .

      - name: Clean-room install and import
        run: |
          python -m venv /tmp/cinenode-release-v1
          /tmp/cinenode-release-v1/bin/python -m pip install --disable-pip-version-check -U pip
          /tmp/cinenode-release-v1/bin/python -m pip install dist/*.whl
          cd /tmp
          CINENODE_HOME=/tmp/cinenode-release-v1-home CINENODE_TEST_MODE=1 /tmp/cinenode-release-v1/bin/python - <<'PY'
          import cinenode
          from cinenode.api.app import create_app
          app = create_app()
          assert cinenode.__version__ == "1.0.0"
          assert app.title == "CineNode"
          paths = {route.path for route in app.routes}
          assert {"/api/health", "/api/jobs", "/api/capabilities"} <= paths
          print({"version": cinenode.__version__, "routes": len(paths)})
          PY

      - name: Real HTTP startup
        run: python scripts/http_smoke.py

      - name: Write verified release evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import datetime
          import hashlib
          import json
          import xml.etree.ElementTree as ET
          import zipfile

          xml_root = ET.parse("junit.xml").getroot()
          suite = xml_root if xml_root.tag == "testsuite" else xml_root.find("testsuite")
          tests = {key: int(float(suite.attrib.get(key, "0"))) for key in ("tests", "failures", "errors", "skipped")}
          if tests["failures"] or tests["errors"]:
              raise SystemExit(f"tests are not green: {tests}")
          coverage = float(json.loads(Path("coverage.json").read_text())["totals"]["percent_covered"])
          wheel = next(Path("dist").glob("*.whl"))
          wheel_data = wheel.read_bytes()
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          required = {
              "cinenode/api/app.py",
              "cinenode/jobs.py",
              "cinenode/capabilities.py",
              "cinenode/engines/base.py",
              "cinenode/plugins/sdk.py",
              "cinenode/web/index.html",
          }
          missing = sorted(required - set(names))
          if missing:
              raise SystemExit(f"wheel missing: {missing}")

          excluded = {
              ".git", ".venv", "dist", "build", "__pycache__", ".pytest_cache", ".ruff_cache",
              "cinenode.egg-info"
          }
          files = []
          for path in sorted(Path.cwd().rglob("*")):
              if not path.is_file() or any(part in excluded for part in path.parts):
                  continue
              rel = path.relative_to(Path.cwd()).as_posix()
              if rel in {"coverage.json", "junit.xml", ".coverage", "SOURCE_MANIFEST.json", "docs/VERIFICATION.json"}:
                  continue
              data = path.read_bytes()
              if "perzon" in rel.lower().split("/"):
                  raise SystemExit(f"PERZON path found in CineNode: {rel}")
              files.append({"path": rel, "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()})
          manifest = {
              "schema_version": 1,
              "product": "CineNode",
              "version": "1.0.0",
              "file_count": len(files),
              "total_bytes": sum(item["bytes"] for item in files),
              "files": files,
          }
          Path("SOURCE_MANIFEST.json").write_text(json.dumps(manifest, indent=2) + "\n")
          record = {
              "schema_version": 2,
              "product": "CineNode",
              "version": "1.0.0",
              "patch_level": 2,
              "quality_gates_passed": True,
              "generated_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "tests": tests,
              "coverage_percent": coverage,
              "wheel": {
                  "name": wheel.name,
                  "entries": len(names),
                  "bytes": len(wheel_data),
                  "sha256": hashlib.sha256(wheel_data).hexdigest(),
              },
              "source_manifest": {
                  "file_count": manifest["file_count"],
                  "total_bytes": manifest["total_bytes"],
              },
              "verified_contracts": [
                  "CineNode and PERZON are separate products",
                  "imports have no runtime filesystem side effects",
                  "typed DAG validation and execution",
                  "durable jobs, node cache and audit",
                  "user cancellation is terminal CANCELLED",
                  "process shutdown is resumable INTERRUPTED",
                  "resume reuses completed node outputs",
                  "portable backup verifies paths, sizes and SHA-256",
                  "engine registries are instance-scoped",
                  "filesystem plugins require an allowlist",
                  "local inference adapters are modular",
                  "server mode requires an explicit token",
                  "wheel includes backend and web canvas",
                  "wheel installs outside the source tree",
                  "real HTTP startup succeeds",
                  "weights, tokens and user databases are excluded from Git",
              ],
          }
          Path("docs").mkdir(exist_ok=True)
          Path("docs/VERIFICATION.json").write_text(json.dumps(record, indent=2) + "\n")
          Path("docs/VERIFICATION.md").write_text(
              "# CineNode release verification\n\n"
              "The `main` tree passed executable release gates.\n\n"
              f"- Tests: **{tests['tests']}**\n"
              f"- Failures: **{tests['failures']}**\n"
              f"- Errors: **{tests['errors']}**\n"
              f"- Skipped: **{tests['skipped']}**\n"
              f"- Measured coverage: **{coverage:.2f}%**\n"
              f"- Wheel entries: **{len(names)}**\n"
              f"- Wheel SHA-256: `{record['wheel']['sha256']}`\n\n"
              "The release gate executed formatting, static analysis, Python compilation, JavaScript syntax, regression, interruption/recovery, portable restore, wheel inspection, clean-room installation and real HTTP startup.\n"
          )
          PY
          rm -f coverage.json junit.xml .coverage

      - name: Commit release directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Verified release already present."
          else
            git commit -m "release: verify CineNode local-first modular core v1.0.0"
            git push origin HEAD:main
          fi
