name: CineNode final main release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cinenode-finalize-main.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinenode-final-main-release
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start from latest remote main
        run: |
          sleep 45
          git fetch origin main
          git reset --hard origin/main

      - name: Materialize and patch CineNode
        run: |
          python3 -m py_compile .cinenode/bootstrap_core_v1.py .cinenode/bootstrap_product_v1.py .cinenode/bootstrap_patch_v1.py .cinenode/bootstrap_patch_v2.py
          python3 .cinenode/bootstrap_core_v1.py
          python3 .cinenode/bootstrap_product_v1.py
          python3 .cinenode/bootstrap_patch_v1.py
          python3 .cinenode/bootstrap_patch_v2.py
          test -f pyproject.toml
          test -f src/cinenode/api/app.py
          test -f src/cinenode/jobs.py
          test -f src/cinenode/web/index.html
          test -f src/cinenode/engines/base.py
          test -f src/cinenode/plugins/sdk.py
          test -f tests/test_recovery.py
          test -f RUN_CINENODE.bat
          if find . -path '*/perzon/*' -print -quit | grep -q .; then
            echo "PERZON source path found in CineNode" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development environment
        run: |
          python -m pip install --disable-pip-version-check -U pip setuptools wheel
          python -m pip install -e '.[dev]'

      - name: Static gates
        run: |
          python -m ruff check . --fix
          python -m ruff format .
          python -m ruff check .
          python -m ruff format --check .
          python -m compileall -q src tests scripts
          for file in src/cinenode/web/*.js; do node --check "$file"; done

      - name: Functional gates
        run: |
          python -m pytest -q --junitxml=junit.xml --cov=cinenode --cov-fail-under=0 --cov-report=json:coverage.json --cov-report=term-missing

      - name: Distribution gates
        run: |
          rm -rf dist build
          python -m build --wheel
          python scripts/check_wheel.py dist/*.whl
          python -m cinenode verify --source .
          python -m venv /tmp/cinenode-final
          /tmp/cinenode-final/bin/python -m pip install --disable-pip-version-check -U pip
          /tmp/cinenode-final/bin/python -m pip install dist/*.whl
          cd /tmp
          CINENODE_HOME=/tmp/cinenode-final-home CINENODE_TEST_MODE=1 /tmp/cinenode-final/bin/python - <<'PY'
          import cinenode
          from cinenode.api.app import create_app
          app = create_app()
          paths = {route.path for route in app.routes}
          assert cinenode.__version__ == "1.0.0"
          assert app.title == "CineNode"
          assert {"/api/health", "/api/capabilities", "/api/jobs", "/api/backups"} <= paths
          print({"version": cinenode.__version__, "routes": len(paths)})
          PY
          cd "$GITHUB_WORKSPACE"
          python scripts/http_smoke.py

      - name: Build final evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import datetime
          import hashlib
          import json
          import xml.etree.ElementTree as ET
          import zipfile

          xml_root = ET.parse("junit.xml").getroot()
          suite = xml_root if xml_root.tag == "testsuite" else xml_root.find("testsuite")
          tests = {key: int(float(suite.attrib.get(key, "0"))) for key in ("tests", "failures", "errors", "skipped")}
          if tests["failures"] or tests["errors"]:
              raise SystemExit(f"test failure: {tests}")
          coverage = float(json.loads(Path("coverage.json").read_text())["totals"]["percent_covered"])
          wheel = next(Path("dist").glob("*.whl"))
          wheel_data = wheel.read_bytes()
          with zipfile.ZipFile(wheel) as archive:
              wheel_names = archive.namelist()
          wheel_required = {
              "cinenode/__init__.py", "cinenode/api/app.py", "cinenode/jobs.py",
              "cinenode/capabilities.py", "cinenode/engines/base.py",
              "cinenode/plugins/sdk.py", "cinenode/web/index.html"
          }
          missing = sorted(wheel_required - set(wheel_names))
          if missing:
              raise SystemExit(f"wheel is incomplete: {missing}")

          excluded = {
              ".git", ".venv", "dist", "build", "__pycache__", ".pytest_cache",
              ".ruff_cache", "cinenode.egg-info"
          }
          files = []
          for path in sorted(Path.cwd().rglob("*")):
              if not path.is_file() or any(part in excluded for part in path.parts):
                  continue
              rel = path.relative_to(Path.cwd()).as_posix()
              if rel in {"coverage.json", "junit.xml", ".coverage", "SOURCE_MANIFEST.json", "docs/VERIFICATION.json"}:
                  continue
              if "perzon" in rel.lower().split("/"):
                  raise SystemExit(f"PERZON path found: {rel}")
              data = path.read_bytes()
              files.append({"path": rel, "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()})
          manifest = {
              "schema_version": 1,
              "product": "CineNode",
              "version": "1.0.0",
              "file_count": len(files),
              "total_bytes": sum(item["bytes"] for item in files),
              "files": files,
          }
          Path("SOURCE_MANIFEST.json").write_text(json.dumps(manifest, indent=2) + "\n")
          evidence = {
              "schema_version": 3,
              "product": "CineNode",
              "version": "1.0.0",
              "patch_level": 2,
              "quality_gates_passed": True,
              "generated_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "tests": tests,
              "coverage_percent": coverage,
              "wheel": {
                  "name": wheel.name,
                  "entries": len(wheel_names),
                  "bytes": len(wheel_data),
                  "sha256": hashlib.sha256(wheel_data).hexdigest(),
              },
              "source_manifest": {
                  "file_count": manifest["file_count"],
                  "total_bytes": manifest["total_bytes"],
              },
              "verified_contracts": [
                  "CineNode is independent from PERZON",
                  "importing the package creates no runtime state",
                  "typed acyclic workflows are validated before execution",
                  "node results and deterministic cache are durable",
                  "CANCELLED and INTERRUPTED have different semantics",
                  "shutdown interruption is resumable from persisted node outputs",
                  "backup is relocatable and checksum verified",
                  "local engine adapters are replaceable modules",
                  "engine registries are application scoped",
                  "filesystem plugins are explicitly allowlisted",
                  "local mode is loopback restricted",
                  "server mode requires an explicit token",
                  "uploads are streamed and size limited",
                  "the wheel contains API, workflow core, engines, plugin SDK and web canvas",
                  "the wheel installs and imports outside the source tree",
                  "a real HTTP process starts and answers health checks",
                  "model weights, tokens and user databases are not versioned",
              ],
          }
          Path("docs").mkdir(exist_ok=True)
          Path("docs/VERIFICATION.json").write_text(json.dumps(evidence, indent=2) + "\n")
          Path("docs/VERIFICATION.md").write_text(
              "# CineNode final verification\n\n"
              "The `main` branch passed executable release gates.\n\n"
              f"- Tests: **{tests['tests']}**\n"
              f"- Failures: **{tests['failures']}**\n"
              f"- Errors: **{tests['errors']}**\n"
              f"- Skipped: **{tests['skipped']}**\n"
              f"- Measured coverage: **{coverage:.2f}%**\n"
              f"- Wheel entries: **{len(wheel_names)}**\n"
              f"- Wheel SHA-256: `{evidence['wheel']['sha256']}`\n\n"
              "Formatting, static analysis, Python compilation, JavaScript syntax, full regression, shutdown/recovery, portable restore, wheel inspection, clean-room installation and real HTTP startup were executed.\n"
          )
          PY
          rm -f coverage.json junit.xml .coverage

      - name: Commit verified main with push conflict protection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Final release already present."
            exit 0
          fi
          git commit -m "release: finalize verified CineNode v1.0.0 on main"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
